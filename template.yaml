AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GitHub Evalator — Webhook Ingress (T01)

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 128
    Timeout: 10

Resources:
  WebhookApi:
    Type: AWS::Serverless::HttpApi

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/webhook/
      Handler: handler.lambda_handler
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook
            Method: POST
            PayloadFormatVersion: "2.0"

Outputs:
  WebhookUrl:
    Description: GitHub webhook ingress URL
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
