AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GitHub Evalator — Webhook Ingress, HMAC Auth, Authoritative State, & SQS Queue (T01-T04)

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 128
    Timeout: 10

Parameters:
  WebhookSecretArn:
    Type: String
    Description: AWS Secrets Manager ARN containing GitHub webhook secret

Resources:
  # Ingress API Gateway (T01)
  WebhookApi:
    Type: AWS::Serverless::HttpApi

  # SQS Burst Buffering & Dead-Letter Queue (T04)
  EventDeadLetterQueue:
    Type: AWS::SQS::Queue

  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventDeadLetterQueue.Arn
        maxReceiveCount: 3

  # Ingress & HMAC Authentication Lambda (T01/T02/T04)
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/webhook/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          GITHUB_WEBHOOK_SECRET_ARN: !Ref WebhookSecretArn
          EVENT_QUEUE_URL: !Ref EventQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref WebhookSecretArn
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt EventQueue.Arn
      Events:
        Webhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Path: /webhook
            Method: POST
            PayloadFormatVersion: "2.0"

  # Single-Table Authoritative State Model (T03)
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  WebhookUrl:
    Description: GitHub webhook ingress URL
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/webhook"
  EventQueueUrl:
    Description: SQS Event Queue URL
    Value: !Ref EventQueue
  EventQueueArn:
    Description: SQS Event Queue ARN
    Value: !GetAtt EventQueue.Arn
  EventDeadLetterQueueArn:
    Description: SQS Event Dead-Letter Queue ARN
    Value: !GetAtt EventDeadLetterQueue.Arn
  StateTableName:
    Description: Authoritative single-table DynamoDB name
    Value: !Ref StateTable

